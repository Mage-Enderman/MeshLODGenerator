name: VPM Release & Listing

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'source.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "pkg_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version is $VERSION"

      - name: Create VPM Zip Package
        run: |
          PKG_NAME="com.mageenderman.meshlodgenerator-${{ steps.version.outputs.pkg_version }}.zip"
          zip -r "$PKG_NAME" package.json package.json.meta README.md LICENSE Editor Editor.meta Animations Animations.meta Shaders Shaders.meta
          echo "Created $PKG_NAME"

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: com.mageenderman.meshlodgenerator-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
